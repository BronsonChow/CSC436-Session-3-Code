<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Guild Quest Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="board-header">
    <h1>The Guild Quest Board</h1>
    <p class="stats">
      Open quests: <span id="open-count">?</span>
      &nbsp;|&nbsp;
      Gold on offer: <span id="gold-total">?</span>
    </p>
  </header>

  <main id="board" class="board">
    <!-- Quest cards render here. If you hardcode a quest in this file, it does not count. -->
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
